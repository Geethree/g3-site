name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Fork and Dependabot PRs without the secret use local Linux execution.
      CI: ${{ secrets.BUILDBUDDY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.27.0
          bazelisk-cache: true
          repository-cache: true
      - name: Install local Chromium
        if: env.BUILDBUDDY_API_KEY == ''
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          bazel run //:playwright -- install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}" >> "${GITHUB_ENV}"
      - name: Test
        run: bazel test //...
